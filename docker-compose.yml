version: '3.8'

services:
  web:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    networks:
      - janrakshak_net

  api:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/janrakshak
      - REDIS_URL=redis://redis:6379/0
    networks:
      - janrakshak_net

  db:
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=janrakshak
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - janrakshak_net

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - janrakshak_net

volumes:
  pgdata:

networks:
  janrakshak_net:
